name: Stage 5.3-5.4 Candidate Registry and Offline Harness

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.github/workflows/stage-5-3-4-registry-harness.yml'
      - 'quant_engine/proof/stage5_candidate.py'
      - 'quant_engine/proof/stage5_harness.py'
      - 'quant_engine/tests/test_stage5_candidate*.py'
      - 'quant_engine/tests/test_stage5_harness.py'
      - 'scripts/generate-stage-5-candidate-registry.py'
      - 'docs/releases/stage-5-3-4-registry-harness.md'

permissions:
  contents: read

jobs:
  registry-and-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      REGISTRY_PATH: artifacts/stage-5-candidate-registry.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r quant_engine/requirements.txt
          npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Run focused offline contract tests
        run: python -m unittest quant_engine.tests.test_stage5_candidate quant_engine.tests.test_stage5_candidate_cli quant_engine.tests.test_stage5_harness
      - name: Download authoritative Stage 4A12 candidate and Stage 5.1 constitution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/evidence
          gh run download 30235971008 -n stage-4a12-candidate-proof-4b34e6a58e0b7bf93774bc8f3055fea60e28117d -D artifacts/evidence/stage4a12
          gh run download 30534333283 -n stage-5-evaluation-spec-913646777a64aa801c7dc263701802249164bf97 -D artifacts/evidence
      - name: Generate and independently verify registry
        run: |
          python scripts/generate-stage-5-candidate-registry.py \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-manifest artifacts/evidence/stage4a12/recomputed-candidate-manifest.json \
            --evaluation-spec artifacts/evidence/stage-5-evaluation-spec.json \
            --dataset-manifest tests/fixtures/stage-5-dataset/stage-5-dataset-manifest.json \
            --output "$REGISTRY_PATH"
          python scripts/generate-stage-5-candidate-registry.py \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-manifest artifacts/evidence/stage4a12/recomputed-candidate-manifest.json \
            --evaluation-spec artifacts/evidence/stage-5-evaluation-spec.json \
            --dataset-manifest tests/fixtures/stage-5-dataset/stage-5-dataset-manifest.json \
            --verify "$REGISTRY_PATH"
      - name: Upload candidate registry
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-candidate-registry-${{ env.SOURCE_COMMIT }}
          path: ${{ env.REGISTRY_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed registry attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.REGISTRY_PATH }}
