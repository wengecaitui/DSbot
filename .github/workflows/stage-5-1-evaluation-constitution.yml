name: Stage 5.1 Evaluation Constitution

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.gitattributes'
      - '.github/workflows/stage-5-1-evaluation-constitution.yml'
      - 'docs/releases/stage-4b-stage-5-durable-authority-bindings.json'
      - 'scripts/verify-durable-authority.py'
      - 'quant_engine/proof/stage5_evaluation.py'
      - 'quant_engine/tests/test_stage5_evaluation.py'
      - 'tests/fixtures/stage-5-evaluation/**'
      - 'tests/fixtures/stage-5-evaluation/stage-5-entry-gate.json'
      - 'scripts/generate-stage-5-evaluation-spec.py'
      - 'docs/releases/stage-5-1-evaluation-constitution.md'

permissions:
  contents: read

jobs:
  evaluation-constitution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SPEC_PATH: artifacts/stage-5-evaluation-spec.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Verify durable Stage 5 entry authority
        run: >-
          python scripts/verify-durable-authority.py
          --bindings docs/releases/stage-4b-stage-5-durable-authority-bindings.json
          --subject STAGE_5_ENTRY_GATE
      - name: Generate and verify frozen evaluation constitution
        run: >-
          python scripts/generate-stage-5-evaluation-spec.py
          --source-commit "$SOURCE_COMMIT"
          --entry-gate tests/fixtures/stage-5-evaluation/stage-5-entry-gate.json
          --output "$SPEC_PATH"
      - name: Upload evaluation constitution
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-evaluation-spec-${{ env.SOURCE_COMMIT }}
          path: ${{ env.SPEC_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed constitution attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.SPEC_PATH }}
