name: Stage 5.1 Evaluation Constitution

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.github/workflows/stage-5-1-evaluation-constitution.yml'
      - 'quant_engine/proof/stage5_evaluation.py'
      - 'quant_engine/tests/test_stage5_evaluation.py'
      - 'tests/fixtures/stage-5-evaluation/**'
      - 'scripts/generate-stage-5-evaluation-spec.py'
      - 'docs/releases/stage-5-1-evaluation-constitution.md'

permissions:
  contents: read

jobs:
  evaluation-constitution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SPEC_PATH: artifacts/stage-5-evaluation-spec.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Download authoritative Stage 5 entry gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/evidence
          gh run download 30530350135 -n stage-5-entry-gate-818770767eab0a7173292b614b6e699a9ce310a1 -D artifacts/evidence
      - name: Generate and verify frozen evaluation constitution
        run: >-
          python scripts/generate-stage-5-evaluation-spec.py
          --source-commit "$SOURCE_COMMIT"
          --entry-gate artifacts/evidence/stage-5-entry-gate.json
          --output "$SPEC_PATH"
      - name: Upload evaluation constitution
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-evaluation-spec-${{ env.SOURCE_COMMIT }}
          path: ${{ env.SPEC_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed constitution attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.SPEC_PATH }}
