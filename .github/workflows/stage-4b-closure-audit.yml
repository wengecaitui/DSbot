name: Stage 4B Closure Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.github/workflows/stage-4b-closure-audit.yml'
      - 'src/validation/Stage4BClosureAudit.ts'
      - 'scripts/generate-stage-4b-closure-audit.mts'
      - 'tests/validation/stage-4b-closure-audit.test.ts'
      - 'tests/fixtures/stage-4b-closure/**'
      - 'docs/releases/stage-4b-closure.md'

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AUDIT_PATH: artifacts/stage-4b-closure-audit.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Install
        run: npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Download authoritative Stage 4B evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/evidence/4b1 artifacts/evidence/4b2 artifacts/evidence/4b3 artifacts/evidence/4b4
          gh run download 30245529110 -n stage-4b1-activation-contract-eee580cb7a25f67cb65aecd9a0a82f71b4921121 -D artifacts/evidence/4b1
          gh run download 30320628525 -n stage-4b2-receipt-81b0980f4fee168075a52c6ebcb12eb50f382217 -D artifacts/evidence/4b2
          gh run download 30365533078 -n stage-4b3-receipt-e6bc1852f55d71fd897a513bb533085596a1a480 -D artifacts/evidence/4b3
          gh run download 30525863496 -n stage-4b4-shadow-proof-9e0d9dafeead4ee22f38ae9e1f964cb15855da27 -D artifacts/evidence/4b4
      - name: Generate and independently verify closure audit
        run: >-
          npx tsx scripts/generate-stage-4b-closure-audit.mts
          --source-commit "$SOURCE_COMMIT"
          --output "$AUDIT_PATH"
          --4b1-subject artifacts/evidence/4b1/stage-4b1-activation-contract-subject.json
          --4b1-artifact artifacts/evidence/4b1/stage-4b1-activation-contract.json
          --4b2-receipt artifacts/evidence/4b2/stage-4b2-receipt.json
          --4b3-receipt artifacts/evidence/4b3/stage-4b3-receipt.json
          --4b4-proof artifacts/evidence/4b4/stage-4b4-shadow-proof.json
      - name: Upload closure subject
        uses: actions/upload-artifact@v4
        with:
          name: stage-4b-closure-audit-${{ env.SOURCE_COMMIT }}
          path: ${{ env.AUDIT_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed closure attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.AUDIT_PATH }}
