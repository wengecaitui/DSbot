name: Stage 4B Closure Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.gitattributes'
      - '.github/workflows/stage-4b-closure-audit.yml'
      - 'docs/releases/stage-4b-stage-5-durable-authority-bindings.json'
      - 'docs/releases/stage-4b1-activation-contract.json'
      - 'scripts/verify-durable-authority.py'
      - 'src/validation/Stage4BClosureAudit.ts'
      - 'scripts/generate-stage-4b-closure-audit.mts'
      - 'tests/fixtures/stage-4b-closure/stage-4b1-subject.json'
      - 'tests/fixtures/stage-4b-closure/stage-4b2-receipt.json'
      - 'tests/fixtures/stage-4b-closure/stage-4b3-receipt.json'
      - 'tests/fixtures/stage-4b-closure/stage-4b4-proof.json'
      - 'tests/validation/stage-4b-closure-audit.test.ts'
      - 'tests/fixtures/stage-4b-closure/**'
      - 'docs/releases/stage-4b-closure.md'

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AUDIT_PATH: artifacts/stage-4b-closure-audit.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Install
        run: npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Verify durable Stage 4B authorities
        run: >-
          python scripts/verify-durable-authority.py
          --bindings docs/releases/stage-4b-stage-5-durable-authority-bindings.json
          --subject STAGE_4B1_SUBJECT
          --subject STAGE_4B1_ACTIVATION_ARTIFACT
          --subject STAGE_4B2_RECEIPT
          --subject STAGE_4B3_RECEIPT
          --subject STAGE_4B4_PROOF
      - name: Generate and independently verify closure audit
        run: >-
          npx tsx scripts/generate-stage-4b-closure-audit.mts
          --source-commit "$SOURCE_COMMIT"
          --output "$AUDIT_PATH"
          --4b1-subject tests/fixtures/stage-4b-closure/stage-4b1-subject.json
          --4b1-artifact docs/releases/stage-4b1-activation-contract.json
          --4b2-receipt tests/fixtures/stage-4b-closure/stage-4b2-receipt.json
          --4b3-receipt tests/fixtures/stage-4b-closure/stage-4b3-receipt.json
          --4b4-proof tests/fixtures/stage-4b-closure/stage-4b4-proof.json
      - name: Upload closure subject
        uses: actions/upload-artifact@v4
        with:
          name: stage-4b-closure-audit-${{ env.SOURCE_COMMIT }}
          path: ${{ env.AUDIT_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed closure attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.AUDIT_PATH }}
