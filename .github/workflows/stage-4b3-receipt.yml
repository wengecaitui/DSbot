name: Stage 4B3 Safety Receipt

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.gitattributes'
      - '.github/workflows/stage-4b3-receipt.yml'
      - 'docs/releases/stage-4b-stage-5-durable-authority-bindings.json'
      - 'scripts/verify-durable-authority.py'
      - 'src/validation/RuntimeSafety.ts'
      - 'scripts/generate-stage-4b3-receipt.mts'
      - 'tests/fixtures/stage-4b-closure/stage-4b2-receipt.json'
      - 'tests/validation/runtime-safety.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RECEIPT_PATH: artifacts/stage-4b3-receipt.json
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Install
        run: npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Verify durable Stage 4B2 authority
        run: >-
          python scripts/verify-durable-authority.py
          --bindings docs/releases/stage-4b-stage-5-durable-authority-bindings.json
          --subject STAGE_4B2_RECEIPT
      - name: Generate Stage 4B3 receipt
        run: npx tsx scripts/generate-stage-4b3-receipt.mts --source-commit "$SOURCE_COMMIT" --output "$RECEIPT_PATH" --4b2-receipt tests/fixtures/stage-4b-closure/stage-4b2-receipt.json
      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-4b3-receipt-${{ env.SOURCE_COMMIT }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed receipt provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.RECEIPT_PATH }}
