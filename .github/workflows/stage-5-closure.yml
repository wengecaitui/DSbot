name: Stage 5 Closure

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.github/workflows/stage-5-closure.yml'
      - 'quant_engine/proof/stage5_closure.py'
      - 'quant_engine/tests/test_stage5_closure.py'
      - 'scripts/generate-stage-5-closure.py'
      - 'docs/releases/stage-5-closure.md'

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: artifacts/evidence
      CLOSURE_PATH: artifacts/stage-5-closure/stage-5-closure.json
    steps:
      - name: Checkout exact closure source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r quant_engine/requirements.txt
          npm ci
      - name: Verify zero-exception production dependency security
        run: npm run security:audit
      - name: Re-run canonical validation
        run: npm run ci
      - name: Run focused closure and tamper tests
        run: python -m unittest quant_engine.tests.test_stage5_closure
      - name: Download authoritative Stage 5 artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$EVIDENCE_DIR/entry" "$EVIDENCE_DIR/evaluation" "$EVIDENCE_DIR/dataset" "$EVIDENCE_DIR/registry" "$EVIDENCE_DIR/research"
          gh run download 30530350135 -n stage-5-entry-gate-818770767eab0a7173292b614b6e699a9ce310a1 -D "$EVIDENCE_DIR/entry"
          gh run download 30534333283 -n stage-5-evaluation-spec-913646777a64aa801c7dc263701802249164bf97 -D "$EVIDENCE_DIR/evaluation"
          gh run download 30538357437 -n stage-5-dataset-manifest-8c87c86107bf32c7e9f2fd4d494a22d612dcf1b8 -D "$EVIDENCE_DIR/dataset"
          gh run download 30541001265 -n stage-5-candidate-registry-2115bfa277d2ca2eb582a010e248f369096cb6fa -D "$EVIDENCE_DIR/registry"
          gh run download 30543669190 -n stage-5-research-promotion-3cbf9b88e7929b5649b84094d77f1492919b2453 -D "$EVIDENCE_DIR/research"
      - name: Verify authoritative raw bytes
        shell: bash
        run: |
          cd "$EVIDENCE_DIR"
          echo 'b33502d272d7c4bd13c9863518600bb6a1c19cf6e52bf150161f4d494c296c28  entry/stage-5-entry-gate.json' | sha256sum -c -
          echo '62bf8ccf9fc18b2818c1d24d05426128092e5dd464760daed89986a947adbc1b  evaluation/stage-5-evaluation-spec.json' | sha256sum -c -
          echo 'c46a5b5a6c6ed831c8de3248b5826f27afd1f1b93154fa7d52d652bff68b4cd4  dataset/stage-5-dataset-manifest.json' | sha256sum -c -
          echo '8364dd6bcb68b318d2550d726c286c24ff4cfbef53e7f698ca3b38db20d1fa7e  registry/stage-5-candidate-registry.json' | sha256sum -c -
          echo '9b0eda9677b63242632a8c3288e902007539fa113ea1362c4ec396e6dfc60186  research/stage-5-research-results.json' | sha256sum -c -
          echo 'edcacb3e73d9ab4788ebaabd84db64f9eb5a29cc839e2d010adf83f1206f6a34  research/stage-5-validation-decision.json' | sha256sum -c -
          echo 'bb7413ff053e368b1499e76e084429a4504faaee4741e39e1606bad9ac930cf9  research/stage-5-promotion-decision.json' | sha256sum -c -
      - name: Verify Stage 5 merge ancestry
        shell: bash
        run: |
          for commit in \
            818770767eab0a7173292b614b6e699a9ce310a1 \
            913646777a64aa801c7dc263701802249164bf97 \
            f7ee27391067c77112a1754ab5c99fc9a5adb6a3 \
            8c87c86107bf32c7e9f2fd4d494a22d612dcf1b8 \
            2115bfa277d2ca2eb582a010e248f369096cb6fa \
            3cbf9b88e7929b5649b84094d77f1492919b2453 \
            b9634af97e226b80890464eadb2f4c4c16b128f3
          do
            git merge-base --is-ancestor "$commit" "$SOURCE_COMMIT"
          done
      - name: Generate and independently verify Stage 5 closure
        run: |
          python scripts/generate-stage-5-closure.py \
            --source-commit "$SOURCE_COMMIT" \
            --final-target-sha "$SOURCE_COMMIT" \
            --entry-gate "$EVIDENCE_DIR/entry/stage-5-entry-gate.json" \
            --evaluation-spec "$EVIDENCE_DIR/evaluation/stage-5-evaluation-spec.json" \
            --dataset-manifest "$EVIDENCE_DIR/dataset/stage-5-dataset-manifest.json" \
            --candidate-registry "$EVIDENCE_DIR/registry/stage-5-candidate-registry.json" \
            --research-results "$EVIDENCE_DIR/research/stage-5-research-results.json" \
            --validation-decision "$EVIDENCE_DIR/research/stage-5-validation-decision.json" \
            --promotion-decision "$EVIDENCE_DIR/research/stage-5-promotion-decision.json" \
            --output "$CLOSURE_PATH"
          python scripts/generate-stage-5-closure.py \
            --source-commit "$SOURCE_COMMIT" \
            --final-target-sha "$SOURCE_COMMIT" \
            --entry-gate "$EVIDENCE_DIR/entry/stage-5-entry-gate.json" \
            --evaluation-spec "$EVIDENCE_DIR/evaluation/stage-5-evaluation-spec.json" \
            --dataset-manifest "$EVIDENCE_DIR/dataset/stage-5-dataset-manifest.json" \
            --candidate-registry "$EVIDENCE_DIR/registry/stage-5-candidate-registry.json" \
            --research-results "$EVIDENCE_DIR/research/stage-5-research-results.json" \
            --validation-decision "$EVIDENCE_DIR/research/stage-5-validation-decision.json" \
            --promotion-decision "$EVIDENCE_DIR/research/stage-5-promotion-decision.json" \
            --verify "$CLOSURE_PATH"
      - name: Upload closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-5-closure-${{ env.SOURCE_COMMIT }}
          path: ${{ env.CLOSURE_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed closure attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.CLOSURE_PATH }}
