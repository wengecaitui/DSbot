name: Stage 4A Closure Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/orangeai-split]
    paths:
      - '.github/workflows/stage-4a-closure-audit.yml'
      - 'docs/releases/stage-4a-closure-audit.*'
      - 'scripts/stage-4a-closure-audit.py'

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SUBJECT_DIR: artifacts/stage-4a-closure
    steps:
      - name: Checkout exact closure commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r quant_engine/requirements.txt
          npm ci
      - name: Re-run canonical validation
        run: npm run ci
      - name: Verify terminal Stage 4A audit
        run: |
          mkdir -p "$SUBJECT_DIR"
          python scripts/stage-4a-closure-audit.py \
            --candidate-manifest docs/releases/stage-4a12-candidate-manifest.json \
            --promotion-decision docs/releases/stage-4a12-promotion-decision.json \
            --failure-attribution docs/releases/stage-4a13-failure-attribution.json \
            --consumed-evidence-seed docs/releases/stage-4a13-consumed-evidence-seed.json \
            --governance-contract docs/releases/stage-4a13-evidence-governance-contract.json \
            --tradeiq-receipt docs/releases/stage-4a10-tradeiq-proof-receipt.json \
            --audit docs/releases/stage-4a-closure-audit.json \
            --receipt-commit "$SOURCE_COMMIT" \
            --subject-output "$SUBJECT_DIR/stage-4a-closure-subject.json"
          cp docs/releases/stage-4a-closure-audit.json "$SUBJECT_DIR/"
      - name: Upload closure subjects
        uses: actions/upload-artifact@v4
        with:
          name: stage-4a-closure-audit-${{ env.SOURCE_COMMIT }}
          path: ${{ env.SUBJECT_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Generate OIDC-backed closure attestations
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.SUBJECT_DIR }}/*.json
