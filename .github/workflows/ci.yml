name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for pinned-commit proof)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify pinned engine commit reachable
        run: |
          git rev-parse --is-shallow-repository
          git cat-file -e 80f12966081e3851424f820dd3428249d5537eb9^{commit}
          echo "is-shallow-repository=false"
          echo "pinned engine commit reachable=true"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Audit Python dependencies
        run: npm run security:audit:python
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm run security:audit
      - name: Typecheck, test, build
        run: npm run ci

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm run security:audit
