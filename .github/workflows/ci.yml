name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for pinned-commit proof)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify tested commit identity
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$CI_EVENT_SHA"
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            expected_sha="$CI_PR_HEAD_SHA"
          fi
          printf '%s\n' \
            "GITHUB_EVENT_NAME=$CI_EVENT_NAME" \
            "GITHUB_EVENT_SHA=$CI_EVENT_SHA" \
            "PR_HEAD_SHA=$CI_PR_HEAD_SHA" \
            "ACTUAL_TESTED_SHA=$actual_sha" \
            "EXPECTED_TESTED_SHA=$expected_sha"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ || "$actual_sha" != "$expected_sha" ]]; then
            echo "EXACT_HEAD_MATCH=false"
            echo "::error::Checked-out commit does not match the expected event head."
            exit 1
          fi
          echo "EXACT_HEAD_MATCH=true"
      - name: Verify pinned engine commit reachable
        run: |
          git rev-parse --is-shallow-repository
          git cat-file -e 80f12966081e3851424f820dd3428249d5537eb9^{commit}
          echo "is-shallow-repository=false"
          echo "pinned engine commit reachable=true"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r quant_engine/requirements.txt
      - name: Audit Python dependencies
        run: npm run security:audit:python
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm run security:audit
      - name: Typecheck, test, build
        run: npm run ci

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify tested commit identity
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$CI_EVENT_SHA"
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            expected_sha="$CI_PR_HEAD_SHA"
          fi
          printf '%s\n' \
            "GITHUB_EVENT_NAME=$CI_EVENT_NAME" \
            "GITHUB_EVENT_SHA=$CI_EVENT_SHA" \
            "PR_HEAD_SHA=$CI_PR_HEAD_SHA" \
            "ACTUAL_TESTED_SHA=$actual_sha" \
            "EXPECTED_TESTED_SHA=$expected_sha"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ || "$actual_sha" != "$expected_sha" ]]; then
            echo "EXACT_HEAD_MATCH=false"
            echo "::error::Checked-out commit does not match the expected event head."
            exit 1
          fi
          echo "EXACT_HEAD_MATCH=true"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm run security:audit
