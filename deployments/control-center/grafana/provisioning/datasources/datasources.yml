apiVersion: 1

datasources:
  - name: DSbot Control Center API
    uid: dsbot-control-center
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://host.docker.internal:8765
    jsonData:
      auth_method: none
      allowedHosts:
        - http://host.docker.internal:8765
    editable: false

  - name: Apache DevLake
    uid: apache-devlake
    type: mysql
    access: proxy
    url: mysql:3306
    database: lake
    user: devlake
    secureJsonData:
      password: ${DEVLAKE_DB_PASSWORD}
    jsonData:
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
      timezone: UTC
    editable: false
